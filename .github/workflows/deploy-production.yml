name: Publicar producción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca interrumpir una migración o publicar dos versiones simultáneamente.
concurrency:
  group: la-imprenta-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verificar, migrar y publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_PROJECT_REF: veplhgkvypxhlkofzuyb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Comprobar secretos necesarios
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secreto $name en GitHub Actions."
              exit 1
            fi
          done

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar código y documentos
        run: |
          npm run typecheck
          npm run test:money
          npm run test:dates
          npm run test:technical
          npm run test:pdf
          npm run test:deployment

      - name: Instalar Vercel CLI
        run: npm install --global vercel@65.4.0

      - name: Obtener configuración de Vercel Production
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verificar que la web apunte a Supabase prod
        run: node --env-file=.vercel/.env.production.local scripts/check-production-env.mjs

      # Se genera el artefacto antes de modificar la base; no se publica todavía.
      - name: Compilar la versión productiva
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Revisar migraciones pendientes
        run: npx --no-install supabase db push --project-ref "$SUPABASE_PROJECT_REF" --skip-vault --dry-run

      - name: Aplicar migraciones pendientes en prod
        run: npx --no-install supabase db push --project-ref "$SUPABASE_PROJECT_REF" --skip-vault --yes

      # Solo se ejecuta si las verificaciones, build y migraciones terminaron bien.
      - name: Publicar en Vercel
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Producción publicada\n\nCommit: `%s`\n\nURL: %s\n' "$GITHUB_SHA" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
